<!DOCTYPE html>
<html lang="en">
<head>

            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            border: 2px solid white;
            display: inline-block;

            transform: translateY(-2px);
